name: Update Project Status in README

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 자동 실행
  workflow_dispatch:      # 수동 실행 버튼 (테스트용)

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Project Status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }} # 아까 만든 토큰 사용
          ORG_NAME: "knights-of-round"
          PROJECT_NUM: 9
        run: |
          # 1. GitHub CLI로 프로젝트 아이템 가져오기 (JSON)
          gh project item-list $PROJECT_NUM --owner $ORG_NAME --format json > project_data.json

          # 2. 데이터 가공하여 마크다운 텍스트 만들기 (간단한 파싱)
          # "In Progress" 상태인 아이템만 뽑아서 리스트로 만듭니다.
          
          echo "### 🔥 In Progress (현재 작업 중)" > status.md
          echo "" >> status.md
          
          # JSON 파싱 및 리스트 생성 (jq 사용)
          jq -r '.items[] | select(.status == "In progress") | "- [ ] " + .title + " (Assignee: " + (.assignees[0].login // "TBD") + ")"' project_data.json >> status.md

          echo "" >> status.md
          echo "Last Updated: $(date '+%Y-%m-%d %H:%M:%S')" >> status.md

      - name: Update README
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const newContent = fs.readFileSync('status.md', 'utf8');
            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');
            
            const startMarker = '';
            const endMarker = '';
            
            const regex = new RegExp(`${startMarker}[\\s\\S]*${endMarker}`);
            const replacement = `${startMarker}\n${newContent}\n${endMarker}`;
            
            fs.writeFileSync(readmePath, readme.replace(regex, replacement));

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update project status" || echo "No changes to commit"
          git push
